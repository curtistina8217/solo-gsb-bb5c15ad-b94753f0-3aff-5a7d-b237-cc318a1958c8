services:
  audit-api:
    build: .
    image: plugin-dependency-audit:latest
    container_name: plugin-dependency-audit
    ports:
      - "8000:8000"
    environment:
      AUDIT_DB_PATH: /data/audits.db
      AUDIT_SEED_PATH: /app/data/seed_registry.json
    volumes:
      - audit-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); sys.exit(0 if json.load(r)['status']=='ok' else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  audit-data:
